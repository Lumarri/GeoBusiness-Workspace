[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "geobusiness-api"
version = "0.1.0"
description = "GeoBusiness AI: bounded OSM commercial queries"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.7,<3", "httpx[socks]>=0.28,<1",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.30,<1", "geoalchemy2>=0.17,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]
# Install when implementing the network analysis and statistical phases.
analysis = ["osmnx>=2,<3", "networkx>=3,<4", "geopandas>=1,<2", "shapely>=2,<3", "numpy>=2,<3", "pandas>=2,<4", "scikit-learn>=1,<2", "scipy>=1,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

